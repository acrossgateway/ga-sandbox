name: catch fairue

on:
  workflow_dispatch:
    inputs:
      prepare-exit-code:
        required: true
        default: 0
      x64-exit-code:
        required: true
        default: 0
      x86-exit-code:
        required: true
        default: 0
      arm64-exit-code:
        required: true
        default: 0
      arm-exit-code:
        required: true
        default: 0


jobs:
  call:
    runs-on: windows-latest

    steps:
    - name: checkout
      id: checkout
      uses: actions/checkout@v6

    - name: prepare-compile
      id: prepare-compile
      shell: pwsh
      run: |
        echo "prepare-compile"
        exit ${{ inputs.prepare-exit-code }}
    
    - name: allow-update-history
      id: allow-update-history
      shell: pwsh
      run: |
        echo "compile env is ready. update-history is allowed to run "
        exit ${{ inputs.prepare-exit-code }}

    - name: x64-compile
      id: x64-compile
      continue-on-error: true
      shell: pwsh
      run: |
        echo "x64-compile"
        exit ${{ inputs.x64-exit-code }}

    - name: x86-compile
      continue-on-error: true
      if: ${{ always() && steps.x64-compile.outcome == 'success' }}
      id: x86-compile
      shell: pwsh
      run: |
        echo "x86-compile"
        exit ${{ inputs.x86-exit-code }}

    - name: arm64-compile
      continue-on-error: true
      if: ${{ always() && steps.x86-compile.outcome == 'success' }}
      id: arm64-compile
      shell: pwsh
      run: |
        echo "arm64-compile"
        exit ${{ inputs.arm64-exit-code }}

    - name: arm-compile
      continue-on-error: true
      if: ${{ always() && steps.arm64-compile.outcome == 'success' }}
      id: arm-compile
      shell: pwsh
      run: |
        echo "arm-compile"
        exit ${{ inputs.arm-exit-code }}

    - name: update-history
      id: update-history
      if: ${{ always() && steps.allow-update-history.outcome == 'success' }}
      shell: pwsh
      run: |
        echo "update-history"

    - name: deploy
      id: deploy
      shell: pwsh
      run: |
        echo "update-history"

    - name: post
      if: ${{ always() }}
      id: post
      shell: pwsh
      run: |
        echo "post"
